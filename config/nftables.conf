#!/usr/sbin/nft -f
#
# Pare-feu du honeypot — machine 192.168.1.63
#
# PRINCIPE :
#   L'isolation du honeypot vit dans la chaîne FORWARD (trafic des conteneurs).
#   La chaîne OUTPUT protège le LAN : rien ne sort vers 192.168.1.0/24 sauf les logs ELK.
#   La sortie Internet de l'HÔTE reste ouverte (80/443) : mises à jour, docker pull,
#   administration à distance. La fermer coupe l'accès et n'ajoute presque rien :
#   un attaquant est dans le CONTENEUR, pas sur l'hôte.
#
# NE PAS utiliser "flush ruleset" : cela détruirait aussi les tables de Docker.

table inet filter
flush table inet filter

define ADMIN_IP     = 192.168.1.33
define SSH_PORT     = 2727
define ELK_IP       = 192.168.1.35
define ELK_PORT     = 5044
define LAN          = 192.168.1.0/24
define LAN6         = { 2a01:e0a:abe:f8e0::/64, fd0f:ee:b0::/48, fe80::/10 }
define COWRIE_PORTS = { 22, 23 }        # ports publies (vus du reseau)
define COWRIE_CPORTS = { 2222, 2223 }   # ports DANS le conteneur (apres DNAT de Docker)
define DOCKER_NET   = 172.16.0.0/12

table inet filter {

    # ------------------------------------------------------------------ INPUT
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif lo accept

        ip saddr $LAN icmp type { echo-request, echo-reply } accept
        icmpv6 type { echo-request, echo-reply, nd-neighbor-solicit,
                      nd-neighbor-advert, nd-router-solicit, nd-router-advert,
                      packet-too-big, time-exceeded, parameter-problem,
                      destination-unreachable } accept

        # administration : SSH depuis le poste admin uniquement
        tcp dport $SSH_PORT ip saddr $ADMIN_IP ct state new accept

        # honeypot : PHASE 1 = accessible depuis le LAN uniquement.
        # Pour exposer sur Internet : retirer les restrictions de source ci-dessous
        # ET ajouter la redirection de port sur la box (voir docs/06).
        ip  saddr $LAN  tcp dport $COWRIE_PORTS ct state new accept
        ip6 saddr $LAN6 tcp dport $COWRIE_PORTS ct state new accept

        # réponses DHCPv6 / RA de la box
        udp sport 547 udp dport 546 accept

        log prefix "IN-DROP " level info limit rate 5/minute
    }

    # ---------------------------------------------------------------- FORWARD
    # C'est ICI que le honeypot est enfermé. Un conteneur compromis ne doit
    # joindre ni le LAN (sauf ELK) ni Internet.
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        # PHASE 1 : seuls les clients du LAN atteignent le conteneur Cowrie.
        # Attention : le DNAT de Docker a deja eu lieu (prerouting), donc on voit
        # ici le port DU CONTENEUR (2222/2223), pas le port publie (22/23).
        ip saddr $LAN ip daddr $DOCKER_NET tcp dport $COWRIE_CPORTS ct state new accept

        # le conteneur n'a le droit de parler qu'à ELK
        ip saddr $DOCKER_NET ip daddr $ELK_IP tcp dport $ELK_PORT ct state new accept

        # tout le reste venant d'un conteneur est refusé et tracé
        ip saddr $DOCKER_NET log prefix "FWD-CONTAINER-DROP " level warn limit rate 10/minute
        log prefix "FWD-DROP " level info limit rate 5/minute
    }

    # ----------------------------------------------------------------- OUTPUT
    chain output {
        type filter hook output priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        oif lo accept

        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit,
                      destination-unreachable, packet-too-big, time-exceeded,
                      parameter-problem } accept
        ip saddr $LAN icmp type echo-request accept

        # --- vers le LAN : UNIQUEMENT les logs vers ELK (exigence du projet) ---
        ip daddr $ELK_IP tcp dport $ELK_PORT ct state new accept
        ip  daddr $LAN  drop
        ip6 daddr $LAN6 drop

        # --- vers Internet : services nécessaires à l'exploitation ---
        udp dport 53 accept          # DNS  (résolveurs : voir resolvectl status)
        tcp dport 53 accept
        udp dport 123 accept         # NTP  (horodatage des logs du honeypot)
        udp dport 547 accept         # DHCPv6
        tcp dport { 80, 443 } ct state new accept   # apt, docker pull, administration

        log prefix "OUT-DROP " level info limit rate 5/minute
    }
}

# Règles optionnelles additionnelles (voir /etc/nftables.d/README)
include "/etc/nftables.d/*.nft"
