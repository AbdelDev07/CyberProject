# Filebeat — expedition des journaux Cowrie vers Logstash (VM ELK 192.168.1.35:5044)
# Le pare-feu n'autorise QUE cette destination vers le LAN.

filebeat.inputs:
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /opt/cowrie/var/log/cowrie/cowrie.json
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
          overwrite_keys: true
    fields:
      honeypot: cowrie
      sensor_host: k8sking
    fields_under_root: true

processors:
  - add_host_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs.version"]
      ignore_missing: true

output.logstash:
  hosts: ["192.168.1.35:5044"]
  # Si Logstash est injoignable, Filebeat reessaie indefiniment sans perdre de donnees.
  bulk_max_size: 512
  ttl: 30s

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 5
